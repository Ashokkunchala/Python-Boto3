[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-boto3-automation"
version = "0.1.0"
description = "Safe AWS automation examples using Python and Boto3"
requires-python = ">=3.10"
dependencies = ["boto3>=1.40,<2", "botocore>=1.40,<2"]

[project.scripts]
aws-auto = "aws_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
